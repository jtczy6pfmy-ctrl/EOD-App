<!DOCTYPE html>
<html lang="en">
<head>

<link rel="apple-touch-icon" href="./990D4EE6-8261-4BFB-B684-468A93C6844E.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="light">
<meta name="apple-mobile-web-app-title" content="EOD Inspection">

<meta name="theme-color" content="#f4f7fb">

<title>EOD Inspection</title>

<style>

/* =========================================================
   EOD INSPECTION — RENDERED APP DESIGN
   FIXED LIGHT APPEARANCE
   ========================================================= */

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html{
 background:#f4f7fb;
 color-scheme:light;
}

body{
 margin:0;
 min-height:100vh;
 background:
   radial-gradient(circle at top left,#ffffff 0%,#f4f7fb 42%,#e9eef5 100%);
 color:#172033;
 font-family:
   -apple-system,
   BlinkMacSystemFont,
   "SF Pro Display",
   "SF Pro Text",
   "Segoe UI",
   sans-serif;
 -webkit-font-smoothing:antialiased;
}

/* =========================================================
   HEADER
   ========================================================= */

header{
 position:relative;
 overflow:hidden;
 padding:18px 18px 22px;
 color:#ffffff;
 text-align:center;
 background:
   linear-gradient(135deg,#101b2d 0%,#1b3150 52%,#274b70 100%);
 box-shadow:0 5px 20px rgba(18,35,58,.22);
}

header:before{
 content:"";
 position:absolute;
 width:210px;
 height:210px;
 border-radius:50%;
 background:rgba(255,255,255,.055);
 top:-120px;
 left:-55px;
}

header:after{
 content:"";
 position:absolute;
 width:180px;
 height:180px;
 border-radius:50%;
 background:rgba(255,255,255,.045);
 right:-65px;
 bottom:-120px;
}

.header-inner{
 position:relative;
 z-index:2;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:12px;
}

.header-icon{
 width:48px;
 height:48px;
 object-fit:contain;
 border-radius:12px;
 background:#ffffff;
 padding:3px;
 box-shadow:0 4px 12px rgba(0,0,0,.18);
}

.header-title{
 font-size:25px;
 font-weight:800;
 letter-spacing:-.4px;
}

.header-subtitle{
 margin-top:3px;
 font-size:12px;
 font-weight:600;
 letter-spacing:1.5px;
 opacity:.72;
 text-transform:uppercase;
}

/* =========================================================
   APP CONTAINER
   ========================================================= */

.app{
 width:min(760px,100%);
 margin:auto;
 padding:16px 12px 45px;
}

/* =========================================================
   CARDS
   ========================================================= */

.card{
 background:rgba(255,255,255,.94);
 border:1px solid #e0e6ee;
 border-radius:20px;
 padding:18px;
 margin-bottom:14px;
 box-shadow:
   0 3px 10px rgba(24,39,60,.055),
   0 12px 30px rgba(24,39,60,.055);
}

.card h2{
 display:flex;
 align-items:center;
 gap:10px;
 margin:0 0 17px;
 font-size:19px;
 line-height:1.2;
 font-weight:800;
 letter-spacing:-.2px;
 color:#18263a;
}

.card h2:before{
 content:"";
 width:5px;
 height:23px;
 border-radius:10px;
 background:linear-gradient(180deg,#315f8e,#1a395b);
 flex:none;
}

/* =========================================================
   TERMINAL / STATUS CARD
   ========================================================= */

.status-card{
 padding:19px;
}

.status-top{
 display:flex;
 align-items:flex-end;
 justify-content:space-between;
 gap:14px;
}

.status-terminal{
 flex:1;
}

.status-progress{
 min-width:100px;
 text-align:right;
}

.status-progress-label{
 font-size:11px;
 font-weight:800;
 letter-spacing:.8px;
 text-transform:uppercase;
 color:#7a8798;
}

.status-progress-number{
 margin-top:2px;
 font-size:27px;
 line-height:1;
 font-weight:850;
 color:#172a43;
}

.date{
 text-align:center;
 margin:12px 0 14px;
 color:#718096;
 font-size:13px;
 font-weight:650;
}

/* =========================================================
   LABELS / INPUTS
   ========================================================= */

label{
 display:block;
 margin:14px 0 6px;
 color:#526176;
 font-size:12px;
 font-weight:800;
 letter-spacing:.35px;
 text-transform:uppercase;
}

input,
select,
textarea{
 width:100%;
 min-height:48px;
 padding:12px 13px;
 border:1px solid #d3dbe6;
 border-radius:12px;
 background:#f9fbfd;
 color:#172033;
 font:inherit;
 font-size:16px;
 outline:none;
 box-shadow:inset 0 1px 2px rgba(20,35,55,.025);
}

input:focus,
select:focus,
textarea:focus{
 border-color:#426d99;
 background:#ffffff;
 box-shadow:
   0 0 0 3px rgba(66,109,153,.11);
}

textarea{
 min-height:105px;
 resize:vertical;
}

.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:13px;
}

.static-type{
 min-height:48px;
 display:flex;
 align-items:center;
 padding:12px 13px;
 border:1px solid #d3dbe6;
 border-radius:12px;
 background:#edf2f7;
 color:#26364b;
 font-size:16px;
 font-weight:750;
}

/* =========================================================
   PROGRESS
   ========================================================= */

.progressbar{
 height:12px;
 padding:2px;
 background:#e2e8f0;
 border-radius:999px;
 overflow:hidden;
}

.fill{
 height:100%;
 width:0;
 border-radius:999px;
 background:
   linear-gradient(90deg,#294c70,#427aa8);
 transition:width .4s ease;
}

.progress-complete-message{
 display:none;
 text-align:center;
 margin-top:9px;
 color:#18794e;
 font-size:13px;
 font-weight:800;
}

.progress-complete-message.show{
 display:block;
}

/* =========================================================
   BUTTONS
   ========================================================= */

button{
 width:100%;
 min-height:49px;
 margin-top:16px;
 padding:13px 16px;
 border:0;
 border-radius:12px;
 background:
   linear-gradient(135deg,#1a3049,#294f73);
 color:#ffffff;
 font:800 15px inherit;
 letter-spacing:.25px;
 cursor:pointer;
 box-shadow:
   0 4px 10px rgba(25,52,80,.16);
 transition:
   transform .12s ease,
   box-shadow .12s ease;
}

button:active{
 transform:scale(.985);
 box-shadow:none;
}

button.secondary{
 background:#edf2f7;
 color:#24364d;
 border:1px solid #d7dfe8;
 box-shadow:none;
}

button.primary{
 background:
   linear-gradient(135deg,#19344f,#315f8e);
}

.reset-button{
 background:#ffffff;
 color:#c0392b;
 border:1px solid #e5a8a1;
 box-shadow:none;
}

.reset-button:active{
 background:#c0392b;
 color:#ffffff;
}

/* =========================================================
   INSPECTION LIST
   ========================================================= */

.inspection-list{
 display:flex;
 flex-direction:column;
 gap:8px;
}

.inspection-row{
 display:grid;
 grid-template-columns:1fr auto;
 gap:10px;
 align-items:center;
 padding:12px 13px;
 border:1px solid #dfe5ec;
 border-radius:13px;
 background:#f7f9fb;
}

.inspection-display{
 color:#24344a;
 font-size:14px;
 font-weight:750;
 line-height:1.4;
}

.edit-button{
 width:43px;
 min-width:43px;
 height:43px;
 min-height:43px;
 margin:0;
 padding:0;
 border-radius:11px;
 font-size:20px;
 box-shadow:none;
}

.edit-button.editing{
 background:#218653;
 color:#fff;
}

.delete-button{
 background:#c83c36!important;
 color:#fff!important;
}

.inspection-edit{
 display:grid;
 grid-template-columns:90px 115px 95px 1fr auto auto;
 gap:7px;
 align-items:center;
 width:100%;
}

.inspection-edit select,
.inspection-edit input{
 min-width:0;
 min-height:43px;
 padding:8px;
 font-size:13px;
 border-radius:9px;
}

.empty-list{
 padding:18px 10px;
 text-align:center;
 color:#7c8998;
 font-size:13px;
 font-weight:650;
}

/* =========================================================
   PREVIEW
   ========================================================= */

#preview{
 white-space:pre-wrap;
 max-height:500px;
 overflow:auto;
 padding:16px;
 border:1px solid #dce3eb;
 border-radius:13px;
 background:#f7f9fb;
 color:#26364b;
 font-family:
   ui-monospace,
   SFMono-Regular,
   Menlo,
   monospace;
 font-size:13px;
 line-height:1.55;
}

.preview-actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

/* =========================================================
   RESET AREA
   ========================================================= */

.reset-card{
 border:1px solid #ead8d5;
 background:#fffafa;
}

.reset-card h2:before{
 background:#c84a43;
}

.hidden{
 display:none!important;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:650px){

 .app{
  padding:12px 10px 35px;
 }

 header{
  padding:15px 14px 18px;
 }

 .header-icon{
  width:43px;
  height:43px;
 }

 .header-title{
  font-size:22px;
 }

 .card{
  padding:16px;
  border-radius:18px;
 }

 .status-top{
  align-items:flex-start;
 }

 .status-progress-number{
  font-size:25px;
 }

 .row{
  grid-template-columns:1fr;
  gap:1px;
 }

 .preview-actions{
  grid-template-columns:1fr;
 }

 .inspection-edit{
  grid-template-columns:1fr 1fr;
 }

 .inspection-edit .edit-button,
 .inspection-edit .delete-button{
  width:100%;
 }

}

/* =========================================================
   VERY SMALL SCREENS
   ========================================================= */

@media(max-width:390px){

 .header-title{
  font-size:20px;
 }

 .status-progress{
  min-width:85px;
 }

}

/* =========================================================
   FORCE LIGHT RENDERING EVEN IN DARK MODE
   ========================================================= */

@media(prefers-color-scheme:dark){

 html,
 body{
  background:#f4f7fb!important;
  color:#172033!important;
 }

 input,
 select,
 textarea{
  background:#f9fbfd!important;
  color:#172033!important;
 }

 .card{
  background:rgba(255,255,255,.94)!important;
  color:#172033!important;
 }

 .card h2{
  color:#18263a!important;
 }

 .inspection-row{
  background:#f7f9fb!important;
 }

 .inspection-display{
  color:#24344a!important;
 }

 #preview{
  background:#f7f9fb!important;
  color:#26364b!important;
 }

 .static-type{
  background:#edf2f7!important;
  color:#26364b!important;
 }

}

</style>
</head>

<body>

<header>

 <div class="header-inner">

  <img
   class="header-icon"
   src="./990D4EE6-8261-4BFB-B684-468A93C6844E.png"
   alt="EOD Inspection"
  >

  <div>
   <div class="header-title">EOD Inspection</div>
   <div class="header-subtitle">End of Day Report</div>
  </div>

 </div>

</header>


<main class="app">


<!-- =====================================================
     TERMINAL / PROGRESS
     ===================================================== -->

<section class="card status-card">

 <div class="status-top">

  <div class="status-terminal">

   <label for="terminal">Terminal</label>

   <select id="terminal">

    <option>APPLIANCE PARK</option>
    <option>ATLANTA</option>
    <option>AUSTELL</option>
    <option>AYER</option>
    <option>BETHLEHEM</option>
    <option>BUFFALO</option>
    <option>CALUMET</option>
    <option>CHARLOTTE</option>
    <option>CHGO 63RD</option>
    <option>CHICAGO 47TH</option>
    <option>CINCINNATI</option>
    <option>CLEVELAND</option>
    <option>CROXTON</option>
    <option>GREENSBORO</option>
    <option selected>HARRISBURG</option>
    <option>JACKSONVILLE</option>
    <option>KANSAS CITY</option>
    <option>LANDERS</option>
    <option>MORRISVILLE</option>
    <option>NORFOLK</option>
    <option>PITTSBURGH</option>
    <option>RICKENBACKER</option>
    <option>ROSSVILLE</option>
    <option>RUTHERFORD</option>
    <option>ST LOUIS</option>
    <option>TAYLOR</option>
    <option>TOLEDO</option>

   </select>

  </div>

  <div class="status-progress">

   <div class="status-progress-label">
    Daily Progress
   </div>

   <div class="status-progress-number">
    <span id="count">0</span>/28
   </div>

  </div>

 </div>


 <div class="date" id="reportDate"></div>


 <div class="progressbar">
  <div class="fill" id="fill"></div>
 </div>


 <div
  class="progress-complete-message"
  id="completeMessage"
 >
  ✓ Daily inspection target complete
 </div>

</section>


<!-- =====================================================
     CHASSIS
     ===================================================== -->

<section class="card">

 <h2>Chassis</h2>

 <div class="row">

  <div>

   <label for="prefix">
    4-Character Prefix
   </label>

   <select id="prefix"></select>

  </div>

  <div>

   <label for="number">
    6-Digit Number
   </label>

   <input
    id="number"
    type="tel"
    inputmode="numeric"
    maxlength="6"
    placeholder="Enter 6 digits"
   >

  </div>

 </div>


 <div class="row">

  <div>

   <label for="type">
    Inspection Type
   </label>

   <select id="type">

    <option value="5652">
     5652 — Pre-repair
    </option>

    <option value="5900">
     5900 — Post-repair
    </option>

    <option value="5658">
     5658 — Add-on
    </option>

   </select>

  </div>


  <div>

   <label for="condition">
    Condition
   </label>

   <select id="condition">

    <option>Defect</option>
    <option>No Defect</option>

   </select>

  </div>

 </div>


 <label for="equipmentNote">
  Inspection Note
 </label>

 <input
  id="equipmentNote"
  placeholder="Example: 145D dwell"
 >


 <button
  id="addInspection"
  class="primary"
 >
  ADD CHASSIS INSPECTION
 </button>

</section>


<!-- =====================================================
     CONTAINERS
     ===================================================== -->

<section class="card">

 <h2>Containers</h2>

 <div class="row">

  <div>

   <label for="containerPrefix">
    4-Character Prefix
   </label>

   <input
    id="containerPrefix"
    maxlength="4"
    placeholder="ABCD"
   >

  </div>

  <div>

   <label for="containerNumber">
    6-Digit Number
   </label>

   <input
    id="containerNumber"
    type="tel"
    inputmode="numeric"
    maxlength="6"
    placeholder="Enter 6 digits"
   >

  </div>

 </div>


 <div class="row">

  <div>

   <label for="containerType">
    Inspection Type
   </label>

   <select id="containerType">

    <option value="5653">
     5653 — Pre-repair
    </option>

    <option value="5900">
     5900 — Post-repair
    </option>

    <option value="5658">
     5658 — Add-on
    </option>

   </select>

  </div>


  <div>

   <label for="containerCondition">
    Condition
   </label>

   <select id="containerCondition">

    <option>Defect</option>
    <option>No Defect</option>

   </select>

  </div>

 </div>


 <label for="containerNote">
  Inspection Note
 </label>

 <input
  id="containerNote"
  placeholder="Example: 145D dwell"
 >


 <button
  id="addContainerInspection"
  class="primary"
 >
  ADD CONTAINER INSPECTION
 </button>

</section>


<!-- =====================================================
     CHASSIS RACKS
     ===================================================== -->

<section class="card">

 <h2>Chassis Racks</h2>

 <div class="row">

  <div>

   <label>
    4-Character Prefix
   </label>

   <div class="static-type">
    ZNSU
   </div>

  </div>


  <div>

   <label for="rackNumber">
    6-Digit Number
   </label>

   <input
    id="rackNumber"
    type="tel"
    inputmode="numeric"
    maxlength="6"
    placeholder="Enter 6 digits"
   >

  </div>

 </div>


 <div class="row">

  <div>

   <label>
    Inspection Type
   </label>

   <div class="static-type">
    5657 — Pre-repair
   </div>

  </div>


  <div>

   <label for="rackCondition">
    Condition
   </label>

   <select id="rackCondition">

    <option>Defect</option>
    <option>No Defect</option>

   </select>

  </div>

 </div>


 <label for="rackNote">
  Inspection Note
 </label>

 <input
  id="rackNote"
  placeholder="Example: 145D dwell"
 >


 <button
  id="addRackInspection"
  class="primary"
 >
  ADD RACK INSPECTION
 </button>

</section>


<!-- =====================================================
     NOTES
     ===================================================== -->

<section class="card">

 <h2>Comments or Notes of Interest</h2>

 <textarea
  id="notes"
  placeholder="Enter comments or notes of interest..."
 ></textarea>


 <button
  id="generateEod"
  class="primary"
 >
  GENERATE EOD
 </button>

</section>


<!-- =====================================================
     INSPECTION LIST
     ===================================================== -->

<section class="card">

 <h2>Inspection List</h2>

 <div
  id="inspectionList"
  class="inspection-list"
 ></div>

</section>


<!-- =====================================================
     PREVIEW
     ===================================================== -->

<section
 class="card hidden"
 id="previewCard"
>

 <h2>EOD Report Preview</h2>

 <div id="preview"></div>

 <div class="preview-actions">

  <button
   id="emailEod"
   class="primary"
  >
   EMAIL EOD
  </button>

  <button
   id="editReport"
   class="secondary"
  >
   BACK TO EDIT
  </button>

 </div>

</section>


<!-- =====================================================
     RESET
     ===================================================== -->

<section class="card reset-card">

 <h2>Daily Reset</h2>

 <button
  id="resetDay"
  class="reset-button"
 >
  RESET FOR NEW DAY
 </button>

</section>

</main>


<script>

(() => {

"use strict";


const STORAGE_KEY="eodInspectionReport_v9";

const TARGET=28;

const TODAY="8/17/26";


const SPECIAL=[
 "CALUMET",
 "LANDERS",
 "CHGO 63RD",
 "CHICAGO 47TH"
];

const BASE=[
 "NSPZ",
 "NSFZ"
];

const EXTRA=[
 "TSXZ",
 "LSFZ",
 "TSFZ",
 "TSNZ",
 "PAHZ",
 "PBRZ",
 "UPDZ",
 "UPHZ",
 "DDRZ",
 "DDTZ",
 "DDGZ"
];


const data={

 chassis:{

  "5652":{
   "Pre-repair":[],
   "Post-repair":[],
   "Add-on":[]
  },

  "5900":{
   "Pre-repair":[],
   "Post-repair":[],
   "Add-on":[]
  },

  "5658":{
   "Pre-repair":[],
   "Post-repair":[],
   "Add-on":[]
  }

 },

 containers:{

  "5653":{
   "Pre-repair":[],
   "Post-repair":[],
   "Add-on":[]
  },

  "5900":{
   "Pre-repair":[],
   "Post-repair":[],
   "Add-on":[]
  },

  "5658":{
   "Pre-repair":[],
   "Post-repair":[],
   "Add-on":[]
  }

 },

 racks:{

  "5657":{
   "Pre-repair":[]
  }

 }

};


const terminal=
 document.getElementById("terminal");

const prefix=
 document.getElementById("prefix");

const list=
 document.getElementById("inspectionList");

const notes=
 document.getElementById("notes");

const count=
 document.getElementById("count");

const fill=
 document.getElementById("fill");


function formatDate(d=new Date()){

 return (
  (d.getMonth()+1)+
  "/"+
  d.getDate()+
  "/"+
  String(d.getFullYear()).slice(-2)
 );

}


function save(){

 localStorage.setItem(
  STORAGE_KEY,
  JSON.stringify({
   terminal:terminal.value,
   date:TODAY,
   data:data,
   notes:notes.value
  })
 );

}


function load(){

 try{
  return JSON.parse(
   localStorage.getItem(STORAGE_KEY)
  );
 }catch(e){
  return null;
 }

}


function updatePrefixes(){

 const current=prefix.value;

 const values=
  SPECIAL.includes(terminal.value)
   ? [...BASE,...EXTRA]
   : BASE;

 prefix.innerHTML="";

 values.forEach(p=>{

  const o=
   document.createElement("option");

  o.value=p;
  o.textContent=p;

  prefix.appendChild(o);

 });

 prefix.value=
  values.includes(current)
   ? current
   : "NSPZ";

}


function total(){

 let n=0;

 Object.values(data).forEach(equipment=>{

  Object.values(equipment).forEach(types=>{

   Object.values(types).forEach(section=>{

    n+=section.length;

   });

  });

 });

 return n;

}


function progress(){

 const n=total();

 count.textContent=n;

 fill.style.width=
  Math.min(100,(n/TARGET)*100)+"%";

 document
  .getElementById("completeMessage")
  .classList
  .toggle("show",n>=TARGET);

}


function sectionFor(type){

 return type==="5652"
  ?"Pre-repair"
  :type==="5900"
  ?"Post-repair"
  :"Add-on";

}


function addChassis(){

 const num=
  document.getElementById("number")
  .value.trim();

 if(!/^\d{6}$/.test(num)){

  alert(
   "Enter exactly 6 digits for the chassis number."
  );

  return;

 }

 const t=
  document.getElementById("type").value;

 const c=
  document.getElementById("condition").value;

 const note=
  document.getElementById("equipmentNote")
  .value.trim();

 data.chassis[t][sectionFor(t)].push([
  prefix.value+" "+num,
  c,
  note
 ]);

 document.getElementById("number").value="";
 document.getElementById("equipmentNote").value="";

 save();
 progress();
 render();

}


function addContainer(){

 const p=
  document.getElementById("containerPrefix")
  .value.trim()
  .toUpperCase();

 const n=
  document.getElementById("containerNumber")
  .value.trim();

 if(!/^[A-Z]{4}$/.test(p)){

  alert(
   "Enter exactly 4 letters for the container prefix."
  );

  return;

 }

 if(!/^\d{6}$/.test(n)){

  alert(
   "Enter exactly 6 digits for the container number."
  );

  return;

 }

 const t=
  document.getElementById("containerType").value;

 data.containers[t][sectionFor(t)].push([
  p+" "+n,
  document.getElementById("containerCondition").value,
  document.getElementById("containerNote").value.trim()
 ]);

 document.getElementById("containerPrefix").value="";
 document.getElementById("containerNumber").value="";
 document.getElementById("containerNote").value="";

 save();
 progress();
 render();

}


function addRack(){

 const n=
  document.getElementById("rackNumber")
  .value.trim();

 if(!/^\d{6}$/.test(n)){

  alert(
   "Enter exactly 6 digits for the chassis rack number."
  );

  return;

 }

 data.racks["5657"]["Pre-repair"].push([
  "ZNSU "+n,
  document.getElementById("rackCondition").value,
  document.getElementById("rackNote").value.trim()
 ]);

 document.getElementById("rackNumber").value="";
 document.getElementById("rackNote").value="";

 save();
 progress();
 render();

}


function chassisRecords(){

 const r=[];

 Object.keys(data.chassis).forEach(type=>{

  const section=sectionFor(type);

  data.chassis[type][section]
  .forEach((item,index)=>{

   r.push({
    type:type,
    section:section,
    index:index,
    number:item[0],
    condition:item[1],
    note:item[2]||""
   });

  });

 });

 return r;

}


function select(values,current){

 const s=
  document.createElement("select");

 values.forEach(v=>{

  const o=
   document.createElement("option");

  o.value=v;
  o.textContent=v;

  if(v===current)
   o.selected=true;

  s.appendChild(o);

 });

 return s;

}


function split(value){

 const p=
  value.trim().split(/\s+/);

 return {
  prefix:p[0]||"",
  number:p.slice(1).join("")
 };

}


function render(){

 list.innerHTML="";

 const records=chassisRecords();

 if(!records.length){

  const e=
   document.createElement("div");

  e.className="empty-list";

  e.textContent=
   "No chassis inspections entered yet.";

  list.appendChild(e);

  return;

 }


 records.forEach(r=>{

  const row=
   document.createElement("div");

  row.className="inspection-row";


  const text=
   document.createElement("div");

  text.className="inspection-display";

  text.textContent=
   r.type+
   " • "+
   r.condition+
   " • "+
   r.number;


  const edit=
   document.createElement("button");

  edit.className="edit-button";
  edit.type="button";
  edit.textContent="✎";
  edit.title="Edit inspection";

  edit.onclick=
   ()=>editRow(row,r);


  row.appendChild(text);
  row.appendChild(edit);

  list.appendChild(row);

 });

}


function editRow(row,r){

 row.innerHTML="";

 const area=
  document.createElement("div");

 area.className="inspection-edit";


 const type=
  select(
   ["5652","5900","5658"],
   r.type
  );


 const condition=
  select(
   ["Defect","No Defect"],
   r.condition
  );


 const parts=split(r.number);


 const prefixes=
  SPECIAL.includes(terminal.value)
   ? [...BASE,...EXTRA]
   : [
      ...BASE,
      ...(EXTRA.includes(parts.prefix)
       ? [parts.prefix]
       : [])
     ];


 const p=
  select(
   [...new Set(prefixes)],
   parts.prefix
  );


 const num=
  document.createElement("input");

 num.type="tel";
 num.inputMode="numeric";
 num.maxLength=6;
 num.value=parts.number;

 num.oninput=()=>{

  num.value=
   num.value
   .replace(/\D/g,"")
   .slice(0,6);

 };


 const check=
  document.createElement("button");

 check.className=
  "edit-button editing";

 check.type="button";
 check.textContent="✓";
 check.title="Save correction";


 const del=
  document.createElement("button");

 del.className=
  "edit-button delete-button";

 del.type="button";
 del.textContent="×";
 del.title="Delete inspection";


 area.append(
  type,
  condition,
  p,
  num,
  check,
  del
 );

 row.appendChild(area);


 check.onclick=()=>{

  if(!/^\d{6}$/.test(num.value)){

   alert(
    "Enter exactly 6 digits for the chassis number."
   );

   return;

  }


  const old=
   data.chassis[r.type][r.section];

  const oldIndex=
   old.findIndex(x=>
    x[0]===r.number &&
    x[1]===r.condition &&
    (x[2]||"")===
    (r.note||"")
   );

  if(oldIndex<0)return;

  old.splice(oldIndex,1);

  const newType=type.value;
  const newSection=sectionFor(newType);

  data.chassis[newType][newSection].push([
   p.value+" "+num.value,
   condition.value,
   r.note||""
  ]);

  save();
  progress();
  render();

 };


 del.onclick=()=>{

  if(!confirm(
   "Delete this inspection?\n\n"+
   r.type+" "+
   r.condition+" "+
   r.number
  ))return;


  const old=
   data.chassis[r.type][r.section];

  const oldIndex=
   old.findIndex(x=>
    x[0]===r.number &&
    x[1]===r.condition &&
    (x[2]||"")===
    (r.note||"")
   );

  if(oldIndex>=0)
   old.splice(oldIndex,1);

  save();
  progress();
  render();

 };

 type.focus();

}


function reportSection(
 out,
 equipment,
 section,
 type,
 noText,
 yesText,
 label
){

 ["No Defect","Defect"]
 .forEach(condition=>{

  const items=
   equipment[type][section]
   .filter(x=>x[1]===condition);

  out.push(
   "("+items.length+") "+
   (
    condition==="Defect"
     ?yesText
     :noText
   )
  );

  out.push(label+":");

  items.forEach((x,i)=>{

   out.push(
    "\t"+
    (i+1)+
    ". "+
    x[0]
   );

   if(x[2]){

    out.push(
     "\t   Note: "+
     x[2]
    );

   }

  });

  out.push("");

 });

}


function buildEOD(){

 const out=[];

 out.push(
  "End of Day Report",
  ""
 );

 out.push(
  "Date: "+formatDate(),
  ""
 );

 out.push(
  "End of Day Report for:",
  terminal.value,
  ""
 );

 out.push("CHASSIS");

 reportSection(
  out,
  data.chassis,
  "Pre-repair",
  "5652",
  "pre-repair NO defects - 5652",
  "pre-repair WITH defects - 5652",
  "Chassis Numbers"
 );

 reportSection(
  out,
  data.chassis,
  "Post-repair",
  "5900",
  "post repair NO defects - 5900",
  "post repair WITH defects - 5900",
  "Chassis Numbers"
 );

 reportSection(
  out,
  data.chassis,
  "Add-on",
  "5658",
  "add-on NO defects - 5658",
  "add-on WITH defects - 5658",
  "Chassis Numbers"
 );

 out.push("CONTAINERS");

 reportSection(
  out,
  data.containers,
  "Pre-repair",
  "5653",
  "pre-repair NO defects - 5653",
  "pre-repair WITH defects - 5653",
  "Container Numbers"
 );

 reportSection(
  out,
  data.containers,
  "Post-repair",
  "5900",
  "post repair NO defects - 5900",
  "post repair WITH defects - 5900",
  "Container Numbers"
 );

 reportSection(
  out,
  data.containers,
  "Add-on",
  "5658",
  "add-on NO defects - 5658",
  "add-on WITH defects - 5658",
  "Container Numbers"
 );

 out.push("CHASSIS RACKS");

 reportSection(
  out,
  data.racks,
  "Pre-repair",
  "5657",
  "pre-repair NO defects - 5657",
  "pre-repair WITH defects - 5657",
  "Chassis Rack Numbers"
 );

 out.push(
  "("+total()+") TOTAL INSPECTIONS",
  ""
 );

 out.push(
  "Comments or Notes of Interest:"
 );

 out.push(
  notes.value.trim()
 );

 return out.join("\n");

}


function generate(){

 save();

 document.getElementById("preview").textContent=
  buildEOD();

 document
  .getElementById("previewCard")
  .classList
  .remove("hidden");

 document
  .getElementById("previewCard")
  .scrollIntoView({
   behavior:"smooth"
  });

}


function email(){

 /*
 IMPORTANT:
 Build the report BEFORE opening Mail.
 */

 const report=buildEOD();

 const subject=
  "End of Day Report - "+
  terminal.value+
  " - "+
  formatDate();

 const mailto=
  "mailto:joe@caliberis.com"+
  "?cc=dgeist@caliberis.com,jdoan@aspectassociates.com"+
  "&subject="+
  encodeURIComponent(subject)+
  "&body="+
  encodeURIComponent(report);


 localStorage.setItem(
  "eodLastSentReport",
  JSON.stringify({
   date:TODAY,
   terminal:terminal.value,
   report:report
  })
 );


 window.location.href=mailto;


 /*
 The report is already inside the
 mailto URL before reset occurs.
 */

 setTimeout(()=>{
  resetForNewDay(false);
 },1500);

}


function resetForNewDay(confirmReset=true){

 if(confirmReset){

  const ok=
   confirm(
    "Reset the EOD Inspection app?\n\n"+
    "This will remove all inspections "+
    "and notes currently saved for today."
   );

  if(!ok)return;

 }


 Object.keys(data).forEach(k=>{

  Object.keys(data[k]).forEach(t=>{

   Object.keys(data[k][t]).forEach(s=>{

    data[k][t][s].length=0;

   });

  });

 });


 localStorage.removeItem(STORAGE_KEY);

 notes.value="";

 document.getElementById("preview").textContent="";

 document
  .getElementById("previewCard")
  .classList
  .add("hidden");

 terminal.value="HARRISBURG";

 updatePrefixes();
 progress();
 render();
 save();

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

}


function restore(){

 const saved=load();

 if(
  saved &&
  saved.date===TODAY &&
  saved.data
 ){

  Object.keys(data).forEach(k=>{

   Object.keys(data[k]).forEach(t=>{

    Object.keys(data[k][t]).forEach(s=>{

     data[k][t][s].length=0;

     if(
      saved.data[k] &&
      saved.data[k][t] &&
      Array.isArray(
       saved.data[k][t][s]
      )
     ){

      data[k][t][s].push(
       ...saved.data[k][t][s]
      );

     }

    });

   });

  });

  terminal.value=
   saved.terminal||
   "HARRISBURG";

  notes.value=
   saved.notes||
   "";

 }

}


terminal.onchange=()=>{

 updatePrefixes();
 save();

};


document
 .getElementById("addInspection")
 .onclick=addChassis;


document
 .getElementById("addContainerInspection")
 .onclick=addContainer;


document
 .getElementById("addRackInspection")
 .onclick=addRack;


document
 .getElementById("generateEod")
 .onclick=generate;


document
 .getElementById("emailEod")
 .onclick=email;


document
 .getElementById("editReport")
 .onclick=()=>{

  document
   .getElementById("previewCard")
   .classList
   .add("hidden");

 };


document
 .getElementById("resetDay")
 .onclick=()=>{

  resetForNewDay(true);

 };


notes.oninput=save;


document
 .getElementById("number")
 .oninput=e=>{

  e.target.value=
   e.target.value
   .replace(/\D/g,"")
   .slice(0,6);

  save();

 };


document
 .getElementById("containerPrefix")
 .oninput=e=>{

  e.target.value=
   e.target.value
   .replace(/[^a-zA-Z]/g,"")
   .toUpperCase()
   .slice(0,4);

  save();

 };


document
 .getElementById("containerNumber")
 .oninput=e=>{

  e.target.value=
   e.target.value
   .replace(/\D/g,"")
   .slice(0,6);

  save();

 };


document
 .getElementById("rackNumber")
 .oninput=e=>{

  e.target.value=
   e.target.value
   .replace(/\D/g,"")
   .slice(0,6);

  save();

 };


["number","containerNumber","rackNumber"]
.forEach(id=>{

 document
  .getElementById(id)
  .onkeydown=e=>{

   if(e.key!=="Enter")return;

   e.preventDefault();

   if(id==="number")
    addChassis();

   if(id==="containerNumber")
    addContainer();

   if(id==="rackNumber")
    addRack();

  };

});


restore();

document
 .getElementById("reportDate")
 .textContent=TODAY;

document.title=
 "EOD Inspection — "+
 terminal.value;

updatePrefixes();
progress();
render();

})();
