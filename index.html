<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="./EOD-Inspection-chassis-icon.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EOD Inspection">

<meta name="theme-color" content="#111111">

<title>EOD Inspection — Harrisburg</title>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#eef0f3;
  color:#171717;
  -webkit-font-smoothing:antialiased;
}

header{
  background:#111;
  color:#fff;
  padding:18px 20px;
  text-align:center;
  font-size:21px;
  font-weight:700;
}

.app{
  max-width:760px;
  margin:0 auto;
  padding:18px 14px 50px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
  margin:0 0 14px;
  font-size:20px;
}

h3{
  margin:0 0 10px;
  font-size:17px;
}

.date{
  text-align:center;
  font-weight:600;
  margin-bottom:12px;
}

.progress{
  font-size:18px;
  font-weight:700;
  text-align:center;
  margin-bottom:8px;
}

.progressbar{
  height:12px;
  background:#ddd;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:20px;
}

.fill{
  height:100%;
  width:0%;
  background:#111;
  transition:width .25s ease;
}

label{
  display:block;
  font-weight:650;
  margin:13px 0 6px;
}

input,select,textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid #c9cdd3;
  border-radius:11px;
  font-size:17px;
  background:#fff;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
  font-size:17px;
  font-weight:750;
  cursor:pointer;
  background:#111;
  color:#fff;
  -webkit-tap-highlight-color:transparent;
}

button.secondary{
  background:#e3e5e8;
  color:#111;
}

button:active{
  transform:scale(.99);
}

.subsection{
  border-top:1px solid #ddd;
  padding-top:18px;
  margin-top:18px;
}

.subsection:first-of-type{
  border-top:0;
  padding-top:0;
  margin-top:0;
}

.section-title{
  font-size:17px;
  font-weight:750;
  margin-bottom:10px;
}

.entry-list{
  margin-top:10px;
}

.entry{
  background:#f5f6f7;
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  margin-top:7px;
  font-size:15px;
}

.hidden{
  display:none;
}

#preview{
  white-space:pre-wrap;
  background:#f5f6f7;
  border:1px solid #d7d9dc;
  border-radius:12px;
  padding:15px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:14px;
  line-height:1.5;
  overflow:auto;
}

@media(max-width:520px){

  .row{
    grid-template-columns:1fr;
  }

  .app{
    padding:12px 10px 40px;
  }

  .card{
    padding:16px;
  }

}

</style>
</head>

<body>

<header>EOD Inspection</header>

<main class="app">


<!-- =========================
     DATE / PROGRESS
     ========================= -->

<section class="card">

  <div class="date" id="reportDate"></div>

  <div class="progress">
    <span id="count">0</span> / 28
  </div>

  <div class="progressbar">
    <div class="fill" id="fill"></div>
  </div>

</section>


<!-- =========================
     ORIGINAL CHASSIS INTERFACE
     ========================= -->

<section class="card">

<h2>Chassis</h2>

<input type="hidden" id="equipment" value="Chassis">


<div class="row">

  <div>

    <label for="prefix">4-Character Prefix</label>

    <select id="prefix">

      <option value="NSPZ">NSPZ</option>
      <option value="NSFZ">NSFZ</option>

    </select>

  </div>


  <div>

    <label for="number">6-Digit Number</label>

    <input
      id="number"
      inputmode="numeric"
      maxlength="6"
      placeholder="Enter 6 digits"
    >

  </div>

</div>


<div class="row">

<div>

<label for="type">Inspection Type</label>

<select id="type">

  <option value="5652">5652 — Pre-repair</option>

  <option value="5900">5900 — Post-repair</option>

  <option value="5658">5658 — Add-on</option>

</select>

</div>


<div>

<label for="condition">Condition</label>

<select id="condition">

  <option value="Defect">Defect</option>

  <option value="No Defect">No Defect</option>

</select>

</div>

</div>


<label for="equipmentNote">Inspection Note</label>

<input
  id="equipmentNote"
  placeholder="Example: 145D dwell"
>


<button id="addInspection">
  ADD INSPECTION
</button>

</section>


<!-- =========================
     CONTAINERS
     ========================= -->

<section class="card">

<h2>Containers</h2>

<input type="hidden" id="containerEquipment" value="Container">


<div class="row">

  <div>

    <label for="containerPrefix">4-Character Prefix</label>

    <input
      id="containerPrefix"
      maxlength="4"
      placeholder="ABCD"
      autocomplete="off"
    >

  </div>


  <div>

    <label for="containerNumber">6-Digit Number</label>

    <input
      id="containerNumber"
      inputmode="numeric"
      maxlength="6"
      placeholder="Enter 6 digits"
      autocomplete="off"
    >

  </div>

</div>


<div class="row">

  <div>

    <label for="containerType">Inspection Type</label>

    <select id="containerType">

      <option value="5653">5653 — Pre-repair</option>

      <option value="5900">5900 — Post-repair</option>

      <option value="5658">5658 — Add-on</option>

    </select>

  </div>


  <div>

    <label for="containerCondition">Condition</label>

    <select id="containerCondition">

      <option value="Defect">Defect</option>

      <option value="No Defect">No Defect</option>

    </select>

  </div>

</div>


<label for="containerNote">Inspection Note</label>

<input
  id="containerNote"
  placeholder="Example: 145D dwell"
>


<button id="addContainerInspection">
  ADD INSPECTION
</button>


<div
  class="entry-list"
  id="containerInspectionList"
></div>

</section>



<!-- =========================
     CHASSIS RACKS
     ========================= -->

<section class="card">

<h2>Chassis Racks</h2>

<input type="hidden" id="rackEquipment" value="Chassis Rack">


<div class="row">

  <div>

    <label for="rackPrefix">4-Character Prefix</label>

    <input
      id="rackPrefix"
      maxlength="4"
      placeholder="ABCD"
      autocomplete="off"
    >

  </div>


  <div>

    <label for="rackNumber">6-Digit Number</label>

    <input
      id="rackNumber"
      inputmode="numeric"
      maxlength="6"
      placeholder="Enter 6 digits"
      autocomplete="off"
    >

  </div>

</div>


<div class="row">

  <div>

    <label for="rackType">Inspection Type</label>

    <select id="rackType">

      <option value="5657">5657 — Pre-repair</option>

    </select>

  </div>


  <div>

    <label for="rackCondition">Condition</label>

    <select id="rackCondition">

      <option value="Defect">Defect</option>

      <option value="No Defect">No Defect</option>

    </select>

  </div>

</div>


<label for="rackNote">Inspection Note</label>

<input
  id="rackNote"
  placeholder="Example: 145D dwell"
>


<button id="addRackInspection">
  ADD INSPECTION
</button>


<div
  class="entry-list"
  id="rackInspectionList"
></div>

</section>


<!-- =========================
     COMMENTS
     ========================= -->

<section class="card">

<h2>Comments or Notes of Interest</h2>

<textarea
  id="notes"
  placeholder="Enter comments or notes of interest..."
></textarea>

<button id="generateEod">
  GENERATE EOD
</button>

</section>


<!-- =========================
     PREVIEW
     ========================= -->

<section class="card hidden" id="previewCard">

<h2>EOD Report Preview</h2>

<div id="preview"></div>

<button id="emailEod" class="secondary">
  EMAIL EOD
</button>

</section>


</main>


<script>
(() => {


/* =========================
   DATA
   ========================= */

const data = {

  chassis: {
    "5652": {
      "Pre-repair": [],
      "Post-repair": [],
      "Add-on": []
    },

    "5900": {
      "Pre-repair": [],
      "Post-repair": [],
      "Add-on": []
    },

    "5658": {
      "Pre-repair": [],
      "Post-repair": [],
      "Add-on": []
    }
  },

  containers: {
    "5653": {
      "Pre-repair": [],
      "Post-repair": [],
      "Add-on": []
    },

    "5900": {
      "Pre-repair": [],
      "Post-repair": [],
      "Add-on": []
    },

    "5658": {
      "Pre-repair": [],
      "Post-repair": [],
      "Add-on": []
    }
  },

  racks: {
    "5657": {
      "Pre-repair": []
    }
  }

};


/* =========================
   NEW SECTION DATA
   ========================= */

const containerSections = {
  "pre-no": [],
  "pre-defect": [],
  "post-no": [],
  "post-defect": [],
  "addon-no": [],
  "addon-defect": []
};

const rackSections = {
  "pre-no": [],
  "pre-defect": []
};


/* =========================
   TOTAL
   ========================= */

function totalInspections(){

  let total = 0;


  Object.values(data).forEach(equipment => {

    Object.values(equipment).forEach(type => {

      Object.values(type).forEach(section => {

        total += section.length;

      });

    });

  });


  Object.values(containerSections).forEach(section => {

    total += section.length;

  });


  Object.values(rackSections).forEach(section => {

    total += section.length;

  });


  return total;

}


function updateProgress(){

  const count = totalInspections();


  document.getElementById("count").textContent =
    count;


  document.getElementById("fill").style.width =
    Math.min(
      100,
      (count / 28) * 100
    ) + "%";

}


/* =========================
   ORIGINAL EQUIPMENT TYPE
   ========================= */

function updateInspectionTypeOptions(){

  const equipment =
    document.getElementById("equipment").value;


  const typeSelect =
    document.getElementById("type");


  if(equipment === "Chassis"){

    typeSelect.innerHTML = `
      <option value="5652">5652 — Pre-repair</option>
      <option value="5900">5900 — Post-repair</option>
      <option value="5658">5658 — Add-on</option>
    `;

  }

  else if(equipment === "Container"){

    typeSelect.innerHTML = `
      <option value="5653">5653 — Pre-repair</option>
      <option value="5900">5900 — Post-repair</option>
      <option value="5658">5658 — Add-on</option>
    `;

  }

  else if(equipment === "Chassis Rack"){

    typeSelect.innerHTML = `
      <option value="5657">5657 — Pre-repair</option>
    `;

  }

}


/* =========================
   ORIGINAL ADD INSPECTION
   ========================= */

function addInspection(){

  const equipment =
    document.getElementById("equipment").value;


  const prefix =
    document.getElementById("prefix").value;


  const number =
    document.getElementById("number").value.trim();


  const type =
    document.getElementById("type").value;


  const condition =
    document.getElementById("condition").value;


  const note =
    document.getElementById("equipmentNote").value.trim();


  if(!/^\d{6}$/.test(number)){

    alert(
      "Enter exactly 6 digits for the equipment number."
    );

    document.getElementById("number").focus();

    return;

  }


  let equipmentData;


  if(equipment === "Chassis"){

    equipmentData =
      data.chassis;

  }

  else if(equipment === "Container"){

    equipmentData =
      data.containers;

  }

  else{

    equipmentData =
      data.racks;

  }


  let section;


  if(type === "5652" || type === "5653"){

    section =
      "Pre-repair";

  }

  else if(type === "5900"){

    section =
      "Post-repair";

  }

  else if(type === "5658"){

    section =
      "Add-on";

  }

  else if(type === "5657"){

    section =
      "Pre-repair";

  }


  equipmentData[type][section].push([

    prefix + " " + number,

    condition,

    note

  ]);


  document.getElementById("number").value =
    "";

  document.getElementById("equipmentNote").value =
    "";


  updateProgress();


  document.getElementById("number").focus();

}


/* =========================
   NEW CONTAINER ADD
   ========================= */

function addContainer(button){

  const section =
    button.dataset.section;


  const container =
    button.closest(".subsection");


  const prefix =
    container
      .querySelector(".container-prefix")
      .value
      .trim()
      .toUpperCase();


  const number =
    container
      .querySelector(".container-number")
      .value
      .trim();


  if(!/^[A-Z]{4}$/.test(prefix)){

    alert(
      "Enter exactly 4 letters for the container prefix."
    );

    container
      .querySelector(".container-prefix")
      .focus();

    return;

  }


  if(!/^\d{6}$/.test(number)){

    alert(
      "Enter exactly 6 digits for the container number."
    );

    container
      .querySelector(".container-number")
      .focus();

    return;

  }


  containerSections[section].push(
    prefix + " " + number
  );


  container
    .querySelector(".container-prefix")
    .value = "";


  container
    .querySelector(".container-number")
    .value = "";


  renderContainerSection(section);


  updateProgress();

}


/* =========================
   NEW RACK ADD
   ========================= */

function addRack(button){

  const section =
    button.dataset.section;


  const container =
    button.closest(".subsection");


  const prefix =
    container
      .querySelector(".rack-prefix")
      .value
      .trim()
      .toUpperCase();


  const number =
    container
      .querySelector(".rack-number")
      .value
      .trim();


  if(!/^[A-Z]{4}$/.test(prefix)){

    alert(
      "Enter exactly 4 letters for the chassis rack prefix."
    );

    container
      .querySelector(".rack-prefix")
      .focus();

    return;

  }


  if(!/^\d{6}$/.test(number)){

    alert(
      "Enter exactly 6 digits for the chassis rack number."
    );

    container
      .querySelector(".rack-number")
      .focus();

    return;

  }


  rackSections[section].push(
    prefix + " " + number
  );


  container
    .querySelector(".rack-prefix")
    .value = "";


  container
    .querySelector(".rack-number")
    .value = "";


  renderRackSection(section);


  updateProgress();

}


/* =========================
   RENDER CONTAINERS
   ========================= */

function renderContainerSection(section){

  const list =
    document.getElementById(
      "container-" +
      section +
      "-list"
    );


  list.innerHTML = "";


  containerSections[section]
    .forEach((number,index) => {

      const div =
        document.createElement("div");

      div.className =
        "entry";


      div.textContent =
        (index + 1) +
        ". " +
        number;


      list.appendChild(div);

    });

}


/* =========================
   RENDER RACKS
   ========================= */

function renderRackSection(section){

  const list =
    document.getElementById(
      "rack-" +
      section +
      "-list"
    );


  list.innerHTML = "";


  rackSections[section]
    .forEach((number,index) => {

      const div =
        document.createElement("div");

      div.className =
        "entry";


      div.textContent =
        (index + 1) +
        ". " +
        number;


      list.appendChild(div);

    });

}


/* =========================
   REPORT SECTION
   ========================= */

function addSectionToReport(
  output,
  equipmentData,
  section,
  type,
  noText,
  yesText,
  numberLabel
){

  ["No Defect","Defect"].forEach(condition => {

    const items =
      equipmentData[type][section]
        .filter(
          item =>
            item[1] === condition
        );


    output.push(
      "(" +
      items.length +
      ") " +
      (
        condition === "Defect"
          ? yesText
          : noText
      )
    );


    output.push(
      numberLabel +
      ":"
    );


    items.forEach((item,index) => {

      output.push(
        "\t" +
        (index + 1) +
        ". " +
        item[0]
      );


      if(item[2]){

        output.push(
          "\t   Note: " +
          item[2]
        );

      }

    });


    output.push("");

  });

}


/* =========================
   NEW SIMPLE REPORT SECTION
   ========================= */

function addNewReportSection(
  output,
  noItems,
  defectItems,
  noText,
  defectText,
  numberLabel
){

  output.push(
    "(" +
    noItems.length +
    ") " +
    noText
  );


  output.push(
    numberLabel +
    ":"
  );


  noItems.forEach((number,index) => {

    output.push(
      "\t" +
      (index + 1) +
      ". " +
      number
    );

  });


  output.push("");


  output.push(
    "(" +
    defectItems.length +
    ") " +
    defectText
  );


  output.push(
    numberLabel +
    ":"
  );


  defectItems.forEach((number,index) => {

    output.push(
      "\t" +
      (index + 1) +
      ". " +
      number
    );

  });


  output.push("");

}


/* =========================
   BUILD EOD
   ========================= */

function buildEOD(){

  const out = [];


  out.push(
    "End of Day Report"
  );

  out.push("");


  out.push(
    "Date: " +
    formatDate()
  );

  out.push("");


  out.push(
    "End of Day Report for:"
  );

  out.push(
    "Harrisburg"
  );

  out.push("");


  /* CHASSIS */

  out.push(
    "CHASSIS"
  );


  addSectionToReport(
    out,
    data.chassis,
    "Pre-repair",
    "5652",
    "pre-repair NO defects - 5652",
    "pre-repair WITH defects - 5652",
    "Chassis Numbers"
  );


  addSectionToReport(
    out,
    data.chassis,
    "Post-repair",
    "5900",
    "post repair NO defects - 5900",
    "post repair WITH defects - 5900",
    "Chassis Numbers"
  );


  addSectionToReport(
    out,
    data.chassis,
    "Add-on",
    "5658",
    "add-on NO defects - 5658",
    "add-on WITH defects - 5658",
    "Chassis Numbers"
  );


  /* CONTAINERS */

  out.push(
    "CONTAINERS"
  );


  addNewReportSection(
    out,
    containerSections["pre-no"],
    containerSections["pre-defect"],
    "pre-repair NO defects - 5653",
    "pre-repair WITH defects - 5653",
    "Container Numbers"
  );


  addNewReportSection(
    out,
    containerSections["post-no"],
    containerSections["post-defect"],
    "post repair NO defects - 5900",
    "post repair WITH defects - 5900",
    "Container Numbers"
  );


  addNewReportSection(
    out,
    containerSections["addon-no"],
    containerSections["addon-defect"],
    "add-on NO defects - 5658",
    "add-on WITH defects - 5658",
    "Container Numbers"
  );


  /* CHASSIS RACKS */

  out.push(
    "CHASSIS RACKS"
  );


  addNewReportSection(
    out,
    rackSections["pre-no"],
    rackSections["pre-defect"],
    "pre-repair NO defects - 5657",
    "pre-repair WITH defects - 5657",
    "Chassis Rack Numbers"
  );


  /* TOTAL */

  out.push(
    "(" +
    totalInspections() +
    ") TOTAL INSPECTIONS"
  );


  out.push("");


  out.push(
    "Comments or Notes of Interest:"
  );


  out.push(
    document
      .getElementById("notes")
      .value
      .trim()
  );


  return out.join("\n");

}


/* =========================
   GENERATE
   ========================= */

function generateEOD(){

  document
    .getElementById("preview")
    .textContent =
      buildEOD();


  document
    .getElementById("previewCard")
    .classList
    .remove("hidden");


  document
    .getElementById("previewCard")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


/* =========================
   DATE
   ========================= */

function formatDate(
  date = new Date()
){

  return (

    (date.getMonth() + 1) +
    "/" +
    date.getDate() +
    "/" +
    String(
      date.getFullYear()
    ).slice(-2)

  );

}


/* =========================
   RESET
   ========================= */

function resetForNextDay(){

  Object.values(data)
    .forEach(equipment => {

      Object.values(equipment)
        .forEach(type => {

          Object.keys(type)
            .forEach(section => {

              type[section].length = 0;

            });

        });

    });


  Object.values(containerSections)
    .forEach(section => {

      section.length = 0;

    });


  Object.values(rackSections)
    .forEach(section => {

      section.length = 0;

    });


  document
    .getElementById("notes")
    .value = "";


  document
    .getElementById("number")
    .value = "";


  document
    .getElementById("equipmentNote")
    .value = "";


  document
    .querySelectorAll(
      ".container-prefix, .container-number, .rack-prefix, .rack-number"
    )
    .forEach(input => {

      input.value = "";

    });


  document
    .getElementById("preview")
    .textContent = "";


  document
    .getElementById("previewCard")
    .classList
    .add("hidden");


  document
    .querySelectorAll(".entry-list")
    .forEach(list => {

      list.innerHTML = "";

    });


  document
    .getElementById("reportDate")
    .textContent =
      "Harrisburg — " +
      formatDate();


  updateProgress();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   EMAIL
   ========================= */

function emailEOD(){

  const body =
    buildEOD();


  const reportDate =
    document
      .getElementById("reportDate")
      .textContent
      .split("—")[1]
      .trim();


  const subject =
    "End of Day Report - Harrisburg - " +
    reportDate;


  resetForNextDay();


  window.location.href =
    "mailto:joe@caliberis.com" +
    "?cc=dgeist@caliberis.com,jdoan@aspectassociates.com" +
    "&subject=" +
    encodeURIComponent(subject) +
    "&body=" +
    encodeURIComponent(body);

}


/* =========================
   EQUIPMENT CHANGE
   ========================= */

document
  .getElementById("equipment")
  .addEventListener(
    "change",
    updateInspectionTypeOptions
  );


/* =========================
   ORIGINAL NUMBER INPUT
   ========================= */

document
  .getElementById("number")
  .addEventListener(
    "input",
    event => {

      event.target.value =
        event.target.value
          .replace(/\D/g,"")
          .slice(0,6);

    }
  );


document
  .getElementById("number")
  .addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter"){

        addInspection();

      }

    }
  );


/* =========================
   NEW CONTAINER INPUTS
   ========================= */

document
  .querySelectorAll(
    ".container-prefix, .rack-prefix"
  )
  .forEach(input => {

    input.addEventListener(
      "input",
      event => {

        event.target.value =
          event.target.value
            .replace(/[^a-zA-Z]/g,"")
            .toUpperCase()
            .slice(0,4);

      }
    );

  });


document
  .querySelectorAll(
    ".container-number, .rack-number"
  )
  .forEach(input => {

    input.addEventListener(
      "input",
      event => {

        event.target.value =
          event.target.value
            .replace(/\D/g,"")
            .slice(0,6);

      }
    );

  });


/* =========================
   NEW BUTTONS
   ========================= */

document
  .querySelectorAll(".container-add")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => addContainer(button)
    );

  });


document
  .querySelectorAll(".rack-add")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => addRack(button)
    );

  });


/* =========================
   MAIN BUTTONS
   ========================= */

document
  .getElementById("addInspection")
  .addEventListener(
    "click",
    addInspection
  );


document
  .getElementById("generateEod")
  .addEventListener(
    "click",
    generateEOD
  );


document
  .getElementById("emailEod")
  .addEventListener(
    "click",
    emailEOD
  );


/* =========================
   STARTUP
   ========================= */

document
  .getElementById("reportDate")
  .textContent =
    "Harrisburg — " +
    formatDate();


updateInspectionTypeOptions();

updateProgress();


})();
</script>

      navigator.serviceWorker.register(

      );

    }
  );

}

</script>
