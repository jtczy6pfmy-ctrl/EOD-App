<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EOD Report</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="app-shell">

    <header>
      <div>
        <p class="eyebrow">Inspection</p>
        <h1>EOD Report</h1>
        <p class="muted">End of Day Report</p>
      </div>
    </header>

    <section class="card">
      <h2>Report Information</h2>

      <div class="grid two">
        <label>
          Date
          <input type="date" id="date">
        </label>

        <label>
          Location
          <input
            type="text"
            id="location"
            placeholder="Harrisburg"
          >
        </label>

        <label>
          Inspector
          <input type="text" id="inspector">
        </label>
      </div>
    </section>

    <section class="card">
      <div class="section-heading">
        <h2>Chassis</h2>
      </div>

      <label>
        Chassis numbers and defects
        <textarea
          id="chassis"
          rows="10"
          placeholder="Enter chassis numbers and defects..."
        ></textarea>
      </label>
    </section>

    <section class="card">
      <div class="section-heading">
        <h2>Other Notes</h2>
      </div>

      <label>
        Additional notes
        <textarea
          id="notes"
          rows="8"
          placeholder="Enter additional notes..."
        ></textarea>
      </label>
    </section>

    <div class="actions">
      <button onclick="generateReport()">Generate Report</button>
      <button
        class="secondary"
        onclick="copyReport()"
      >
        Copy Report
      </button>
      <button
        class="secondary"
        onclick="clearForm()"
      >
        Clear
      </button>
    </div>

    <section class="card output-card">
      <div class="section-heading">
        <h2>Report Preview</h2>
        <span class="status" id="status"></span>
      </div>

      <pre id="output"></pre>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
