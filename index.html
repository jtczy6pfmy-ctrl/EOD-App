<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EOD Report</title>
</head>
<body>
  <h1>EOD Report</h1>
  <p>End of Day Report</p>

  <label>
    Date:
    <input type="date" id="date">
  </label>

  <br><br>

  <label>
    Location:
    <input type="text" id="location" placeholder="Harrisburg">
  </label>

  <br><br>

  <label>
    Inspector:
    <input type="text" id="inspector">
  </label>

  <br><br>

  <h2>Chassis</h2>

  <textarea
    id="chassis"
    rows="10"
    cols="40"
    placeholder="Enter chassis numbers and defects..."
  ></textarea>

  <br><br>

  <h2>Other Notes</h2>

  <textarea
    id="notes"
    rows="8"
    cols="40"
    placeholder="Enter additional notes..."
  ></textarea>

  <br><br>

  <button onclick="generateReport()">Generate Report</button>
  <button onclick="copyReport()">Copy Report</button>

  <h2>Report Preview</h2>

  <pre id="output"></pre>

  <script>
    function generateReport() {
      const date = document.getElementById("date").value;
      const location = document.getElementById("location").value;
      const inspector = document.getElementById("inspector").value;
      const chassis = document.getElementById("chassis").value;
      const notes = document.getElementById("notes").value;

      const report =
`End of Day Report

Date: ${date}

End of Day Report for:
${location}

Inspector:
${inspector}

CHASSIS
${chassis}

OTHER NOTES
${notes}`;

      document.getElementById("output").textContent = report;
    }

    function copyReport() {
      const text = document.getElementById("output").textContent;

      navigator.clipboard.writeText(text).then(() => {
        alert("Report copied!");
      });
    }
  </script>
</body>
</html>
