<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EOD Report</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>EOD Report</h1>
  <p>End of Day Report</p>

  <label>
    Date:
    <input type="date" id="date">
  </label>

  <br><br>

  <label>
    Location:
    <input type="text" id="location" placeholder="Harrisburg">
  </label>

  <br><br>

  <label>
    Inspector:
    <input type="text" id="inspector">
  </label>

  <br><br>

  <h2>Chassis</h2>

  <textarea
    id="chassis"
    rows="10"
    cols="40"
    placeholder="Enter chassis numbers and defects..."
  ></textarea>

  <br><br>

  <h2>Other Notes</h2>

  <textarea
    id="notes"
    rows="8"
    cols="40"
    placeholder="Enter additional notes..."
  ></textarea>

  <br><br>

  <button onclick="generateReport()">Generate Report</button>
  <button onclick="copyReport()">Copy Report</button>

  <h2>Report Preview</h2>

  <pre id="output"></pre>

<script src="app.js"></script>
</body>
</html>
