<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="apple-touch-icon" href="./EOD-Inspection-chassis-icon.png">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="EOD Inspection Report"
  >

  <meta
    name="theme-color"
    content="#eef1f5"
    media="(prefers-color-scheme: light)"
  >

  <meta
    name="theme-color"
    content="#0b0f14"
    media="(prefers-color-scheme: dark)"
  >

  <title>EOD Inspection — Harrisburg</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  color-scheme:light dark;

  --bg:#eef1f5;
  --card:#ffffff;
  --card-border:#dfe3e8;
  --text:#17202a;
  --muted:#68727d;
  --input:#ffffff;
  --input-border:#c8ced6;
  --accent:#17202a;
  --accent-text:#ffffff;
  --secondary:#e5e8ec;
  --secondary-text:#17202a;
  --progress-bg:#d9dee5;
  --shadow:0 4px 18px rgba(15,23,42,.08);
}

html{
  background:var(--bg);
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

/* =========================
   HEADER
   ========================= */

header{
  background:linear-gradient(
    180deg,
    #15191e 0%,
    #0b0d10 100%
  );

  color:#fff;

  padding:20px 20px 19px;

  text-align:center;

  font-size:22px;

  font-weight:750;

  letter-spacing:.01em;

  box-shadow:
    0 2px 10px rgba(0,0,0,.18);
}


/* =========================
   MAIN APP
   ========================= */

.app{
  width:min(760px,100%);

  margin:0 auto;

  padding:18px 14px 50px;
}


/* =========================
   CARDS
   ========================= */

.card{
  background:var(--card);

  border:1px solid var(--card-border);

  border-radius:16px;

  padding:20px;

  margin-bottom:16px;

  box-shadow:var(--shadow);
}

.card h2{
  display:flex;

  align-items:center;

  gap:10px;

  margin:0 0 18px;

  font-size:20px;

  line-height:1.2;

  font-weight:750;

  letter-spacing:-.01em;
}

.card h2::before{
  content:"";

  display:block;

  width:4px;

  height:22px;

  border-radius:4px;

  background:var(--accent);
}


/* =========================
   DATE / PROGRESS
   ========================= */

.date{
  text-align:center;

  color:var(--muted);

  font-size:15px;

  font-weight:650;

  margin-bottom:12px;
}

.progress{
  font-size:17px;

  font-weight:750;

  text-align:center;

  margin-bottom:9px;
}

.progress span{
  font-size:24px;
}

.progressbar{
  height:11px;

  background:var(--progress-bg);

  border-radius:20px;

  overflow:hidden;
}

.fill{
  height:100%;

  width:0%;

  background:var(--accent);

  border-radius:20px;

  transition:width .25s ease;
}


/* =========================
   LABELS
   ========================= */

label{
  display:block;

  font-weight:700;

  font-size:14px;

  color:var(--text);

  margin:15px 0 7px;
}


/* =========================
   INPUTS
   ========================= */

input,
select,
textarea{
  width:100%;

  padding:13px 14px;

  border:1px solid var(--input-border);

  border-radius:10px;

  font-family:inherit;

  font-size:17px;

  background:var(--input);

  color:var(--text);

  outline:none;

  transition:
    border-color .15s ease,
    box-shadow .15s ease,
    background .15s ease;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#6b7280;

  box-shadow:
    0 0 0 3px rgba(107,114,128,.14);
}

input::placeholder,
textarea::placeholder{
  color:#8a939e;
}

textarea{
  min-height:115px;

  resize:vertical;
}


/* =========================
   TWO COLUMN ROWS
   ========================= */

.row{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;
}


/* =========================
   STATIC FIELDS
   ========================= */

.static-type{
  padding:13px 14px;

  border:1px solid var(--input-border);

  border-radius:10px;

  font-size:17px;

  background:var(--secondary);

  color:var(--text);

  font-weight:700;

  min-height:49px;

  display:flex;

  align-items:center;
}


/* =========================
   BUTTONS
   ========================= */

button{
  width:100%;

  border:0;

  border-radius:10px;

  padding:14px 16px;

  margin-top:17px;

  min-height:50px;

  font-family:inherit;

  font-size:16px;

  font-weight:750;

  letter-spacing:.02em;

  cursor:pointer;

  background:var(--accent);

  color:var(--accent-text);

  -webkit-tap-highlight-color:transparent;

  box-shadow:
    0 2px 5px rgba(0,0,0,.12);

  transition:
    transform .08s ease,
    opacity .15s ease,
    box-shadow .15s ease;
}

button:hover{
  box-shadow:
    0 4px 10px rgba(0,0,0,.16);
}

button:active{
  transform:scale(.985);

  box-shadow:
    0 1px 3px rgba(0,0,0,.12);
}

button.secondary{
  background:var(--secondary);

  color:var(--secondary-text);

  box-shadow:none;
}


/* =========================
   ENTRIES
   ========================= */

.entry-list{
  margin-top:10px;
}

.entry{
  background:var(--secondary);

  border:1px solid var(--card-border);

  border-radius:10px;

  padding:11px 12px;

  margin-top:7px;

  font-size:15px;

  line-height:1.4;
}


/* =========================
   EOD PREVIEW
   ========================= */

#preview{
  white-space:pre-wrap;

  background:var(--secondary);

  border:1px solid var(--card-border);

  border-radius:11px;

  padding:15px;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  font-size:14px;

  line-height:1.55;

  overflow:auto;

  color:var(--text);
}


/* =========================
   HIDDEN
   ========================= */

.hidden{
  display:none;
}


/* =========================
   MOBILE / IPAD
   ========================= */

@media(max-width:520px){

  .app{
    padding:12px 10px 40px;
  }

  .card{
    padding:17px;

    border-radius:15px;
  }

  .row{
    grid-template-columns:1fr;

    gap:2px;
  }

  header{
    padding:18px 16px;

    font-size:21px;
  }

  button{
    min-height:52px;
  }

}


/* =========================
   DARK MODE
   FOLLOWS IPAD SYSTEM SETTING
   ========================= */

@media(prefers-color-scheme:dark){

  :root{

    --bg:#0b0f14;

    --card:#171d24;

    --card-border:#2b333d;

    --text:#f4f6f8;

    --muted:#a7b0ba;

    --input:#0f141a;

    --input-border:#3b4550;

    --accent:#f4f6f8;

    --accent-text:#11161c;

    --secondary:#242c35;

    --secondary-text:#f4f6f8;

    --progress-bg:#303943;

    --shadow:
      0 4px 18px rgba(0,0,0,.28);
  }

  html{
    background:#0b0f14;
  }

  body{
    background:#0b0f14;

    color:#f4f6f8;
  }

  header{
    background:#000;

    color:#fff;
  }

  .card{
    background:#171d24;

    border-color:#2b333d;
  }

  .card h2::before{
    background:#f4f6f8;
  }

  .progressbar{
    background:#303943;
  }

  .fill{
    background:#f4f6f8;
  }

  input,
  select,
  textarea{
    background:#0f141a;

    color:#f4f6f8;

    border-color:#3b4550;
  }

  input:focus,
  select:focus,
  textarea:focus{
    border-color:#9aa4af;

    box-shadow:
      0 0 0 3px rgba(154,164,175,.14);
  }

  input::placeholder,
  textarea::placeholder{
    color:#7f8994;
  }

  .static-type{
    background:#242c35;

    border-color:#3b4550;

    color:#f4f6f8;
  }

  button{
    background:#f4f6f8;

    color:#11161c;
  }

  button.secondary{
    background:#303943;

    color:#f4f6f8;
  }

  .entry{
    background:#242c35;

    border-color:#3b4550;

    color:#f4f6f8;
  }

  #preview{
    background:#0f141a;

    border-color:#3b4550;

    color:#f4f6f8;
  }

}

</style>

</head>

<body>

<header>EOD Inspection</header>

<main class="app">


<section class="card">

  <div
    class="date"
    id="reportDate"
  ></div>

  <div class="progress">

    <span id="count">0</span> / 28

  </div>

  <div class="progressbar">

    <div
      class="fill"
      id="fill"
    ></div>

  </div>

</section>


<!-- =========================
     CHASSIS
     ========================= -->

<section class="card">

<h2>Chassis</h2>

<input
  type="hidden"
  id="equipment"
  value="Chassis"
>

<div class="row">

  <div>

    <label for="prefix">
      4-Character Prefix
    </label>

    <select id="prefix">

      <option value="NSPZ">
        NSPZ
      </option>

      <option value="NSFZ">
        NSFZ
      </option>

    </select>

  </div>


  <div>

    <label for="number">
      6-Digit Number
    </label>

    <input
      id="number"
      inputmode="numeric"
      maxlength="6"
      placeholder="Enter 6 digits"
    >

  </div>

</div>


<div class="row">

  <div>

    <label for="type">
      Inspection Type
    </label>

    <select id="type">

      <option value="5652">
        5652 — Pre-repair
      </option>

      <option value="5900">
        5900 — Post-repair
      </option>

      <option value="5658">
        5658 — Add-on
      </option>

    </select>

  </div>


  <div>

    <label for="condition">
      Condition
    </label>

    <select id="condition">

      <option value="Defect">
        Defect
      </option>

      <option value="No Defect">
        No Defect
      </option>

    </select>

  </div>

</div>


<label for="equipmentNote">
  Inspection Note
</label>

<input
  id="equipmentNote"
  placeholder="Example: 145D dwell"
>


<button id="addInspection">
  ADD INSPECTION
</button>

</section>


<!-- =========================
     CONTAINERS
     ========================= -->

<section class="card">

<h2>Containers</h2>

<div class="row">

  <div>

    <label for="containerPrefix">
      4-Character Prefix
    </label>

    <input
      id="containerPrefix"
      class="container-prefix"
      maxlength="4"
      placeholder="ABCD"
      autocomplete="off"
    >

  </div>


  <div>

    <label for="containerNumber">
      6-Digit Number
    </label>

    <input
      id="containerNumber"
      class="container-number"
      inputmode="numeric"
      maxlength="6"
      placeholder="Enter 6 digits"
      autocomplete="off"
    >

  </div>

</div>


<div class="row">

  <div>

    <label for="containerType">
      Inspection Type
    </label>

    <select id="containerType">

      <option value="5653">
        5653 — Pre-repair
      </option>

      <option value="5900">
        5900 — Post-repair
      </option>

      <option value="5658">
        5658 — Add-on
      </option>

    </select>

  </div>


  <div>

    <label for="containerCondition">
      Condition
    </label>

    <select id="containerCondition">

      <option value="Defect">
        Defect
      </option>

      <option value="No Defect">
        No Defect
      </option>

    </select>

  </div>

</div>


<label for="containerNote">
  Inspection Note
</label>

<input
  id="containerNote"
  placeholder="Example: 145D dwell"
>


<button id="addContainerInspection">
  ADD INSPECTION
</button>

</section>


<!-- =========================
     CHASSIS RACKS
     ========================= -->

<section class="card">

<h2>Chassis Racks</h2>

<div class="row">

  <div>

    <label>
      4-Character Prefix
    </label>

    <div class="static-type">
      ZNSU
    </div>

  </div>


  <div>

    <label for="rackNumber">
      6-Digit Number
    </label>

    <input
      id="rackNumber"
      class="rack-number"
      inputmode="numeric"
      maxlength="6"
      placeholder="Enter 6 digits"
      autocomplete="off"
    >

  </div>

</div>


<div class="row">

  <div>

    <label>
      Inspection Type
    </label>

    <div class="static-type">
      5657 — Pre-repair
    </div>

  </div>


  <div>

    <label for="rackCondition">
      Condition
    </label>

    <select id="rackCondition">

      <option value="Defect">
        Defect
      </option>

      <option value="No Defect">
        No Defect
      </option>

    </select>

  </div>

</div>


<label for="rackNote">
  Inspection Note
</label>

<input
  id="rackNote"
  placeholder="Example: 145D dwell"
>


<button id="addRackInspection">
  ADD INSPECTION
</button>

</section>


<!-- =========================
     COMMENTS
     ========================= -->

<section class="card">

<h2>Comments or Notes of Interest</h2>

<textarea
  id="notes"
  placeholder="Enter comments or notes of interest..."
></textarea>

<button id="generateEod">
  GENERATE EOD
</button>

</section>


<!-- =========================
     PREVIEW
     ========================= -->

<section
  class="card hidden"
  id="previewCard"
>

<h2>EOD Report Preview</h2>

<div id="preview"></div>

<button
  id="emailEod"
  class="secondary"
>
  EMAIL EOD
</button>

</section>


</main>


<script>

(() => {

const data = {

  chassis: {

    "5652": {
      "Pre-repair": [],
      "Post-repair": [],
      "Add-on": []
    },

    "5900": {
      "Pre-repair": [],
      "Post-repair": [],
      "Add-on": []
    },

    "5658": {
      "Pre-repair": [],
      "Post-repair": [],
      "Add-on": []
    }

  },


  containers: {

    "5653": {
      "Pre-repair": [],
      "Post-repair": [],
      "Add-on": []
    },

    "5900": {
      "Pre-repair": [],
      "Post-repair": [],
      "Add-on": []
    },

    "5658": {
      "Pre-repair": [],
      "Post-repair": [],
      "Add-on": []
    }

  },


  racks: {

    "5657": {
      "Pre-repair": []
    }

  }

};


function totalInspections(){

  let total = 0;

  Object.values(data).forEach(equipment => {

    Object.values(equipment).forEach(type => {

      Object.values(type).forEach(section => {

        total += section.length;

      });

    });

  });

  return total;

}


function updateProgress(){

  const count =
    totalInspections();

  document
    .getElementById("count")
    .textContent = count;

  document
    .getElementById("fill")
    .style.width =
      Math.min(
        100,
        (count / 28) * 100
      ) + "%";

}


/* =========================
   CHASSIS
   ========================= */

function addInspection(){

  const prefix =
    document
      .getElementById("prefix")
      .value;

  const number =
    document
      .getElementById("number")
      .value
      .trim();

  const type =
    document
      .getElementById("type")
      .value;

  const condition =
    document
      .getElementById("condition")
      .value;

  const note =
    document
      .getElementById("equipmentNote")
      .value
      .trim();


  if(!/^\d{6}$/.test(number)){

    alert(
      "Enter exactly 6 digits for the chassis number."
    );

    document
      .getElementById("number")
      .focus();

    return;

  }


  const section =
    type === "5652"
      ? "Pre-repair"
      : type === "5900"
        ? "Post-repair"
        : "Add-on";


  data.chassis[type][section].push([

    prefix + " " + number,

    condition,

    note

  ]);


  document
    .getElementById("number")
    .value = "";

  document
    .getElementById("equipmentNote")
    .value = "";


  updateProgress();

  document
    .getElementById("number")
    .focus();

}


/* =========================
   CONTAINERS
   ========================= */

function addContainerInspection(){

  const prefix =
    document
      .getElementById("containerPrefix")
      .value
      .trim()
      .toUpperCase();

  const number =
    document
      .getElementById("containerNumber")
      .value
      .trim();

  const type =
    document
      .getElementById("containerType")
      .value;

  const condition =
    document
      .getElementById("containerCondition")
      .value;

  const note =
    document
      .getElementById("containerNote")
      .value
      .trim();


  if(!/^[A-Z]{4}$/.test(prefix)){

    alert(
      "Enter exactly 4 letters for the container prefix."
    );

    document
      .getElementById("containerPrefix")
      .focus();

    return;

  }


  if(!/^\d{6}$/.test(number)){

    alert(
      "Enter exactly 6 digits for the container number."
    );

    document
      .getElementById("containerNumber")
      .focus();

    return;

  }


  const section =
    type === "5653"
      ? "Pre-repair"
      : type === "5900"
        ? "Post-repair"
        : "Add-on";


  data.containers[type][section].push([

    prefix + " " + number,

    condition,

    note

  ]);


  document
    .getElementById("containerPrefix")
    .value = "";

  document
    .getElementById("containerNumber")
    .value = "";

  document
    .getElementById("containerNote")
    .value = "";


  updateProgress();

  document
    .getElementById("containerPrefix")
    .focus();

}


/* =========================
   CHASSIS RACKS
   ========================= */

function addRackInspection(){

  const prefix = "ZNSU";

  const number =
    document
      .getElementById("rackNumber")
      .value
      .trim();

  const condition =
    document
      .getElementById("rackCondition")
      .value;

  const note =
    document
      .getElementById("rackNote")
      .value
      .trim();


  if(!/^\d{6}$/.test(number)){

    alert(
      "Enter exactly 6 digits for the chassis rack number."
    );

    document
      .getElementById("rackNumber")
      .focus();

    return;

  }


  data.racks["5657"]["Pre-repair"].push([

    prefix + " " + number,

    condition,

    note

  ]);


  document
    .getElementById("rackNumber")
    .value = "";

  document
    .getElementById("rackNote")
    .value = "";


  updateProgress();

  document
    .getElementById("rackNumber")
    .focus();

}


/* =========================
   REPORT
   ========================= */

function addSectionToReport(
  output,
  equipmentData,
  section,
  type,
  noText,
  yesText,
  numberLabel
){

  ["No Defect","Defect"]
    .forEach(condition => {

      const items =
        equipmentData[type][section]
          .filter(
            item =>
              item[1] === condition
          );


      output.push(
        "(" +
        items.length +
        ") " +
        (
          condition === "Defect"
            ? yesText
            : noText
        )
      );


      output.push(
        numberLabel +
        ":"
      );


      items.forEach((item,index) => {

        output.push(
          "\t" +
          (index + 1) +
          ". " +
          item[0]
        );


        if(item[2]){

          output.push(
            "\t   Note: " +
            item[2]
          );

        }

      });


      output.push("");

    });

}


function buildEOD(){

  const out = [];


  out.push(
    "End of Day Report"
  );

  out.push("");


  out.push(
    "Date: " +
    formatDate()
  );

  out.push("");


  out.push(
    "End of Day Report for:"
  );

  out.push(
    "Harrisburg"
  );

  out.push("");


  out.push(
    "CHASSIS"
  );


  addSectionToReport(
    out,
    data.chassis,
    "Pre-repair",
    "5652",
    "pre-repair NO defects - 5652",
    "pre-repair WITH defects - 5652",
    "Chassis Numbers"
  );


  addSectionToReport(
    out,
    data.chassis,
    "Post-repair",
    "5900",
    "post repair NO defects - 5900",
    "post repair WITH defects - 5900",
    "Chassis Numbers"
  );


  addSectionToReport(
    out,
    data.chassis,
    "Add-on",
    "5658",
    "add-on NO defects - 5658",
    "add-on WITH defects - 5658",
    "Chassis Numbers"
  );


  out.push(
    "CONTAINERS"
  );


  addSectionToReport(
    out,
    data.containers,
    "Pre-repair",
    "5653",
    "pre-repair NO defects - 5653",
    "pre-repair WITH defects - 5653",
    "Container Numbers"
  );


  addSectionToReport(
    out,
    data.containers,
    "Post-repair",
    "5900",
    "post repair NO defects - 5900",
    "post repair WITH defects - 5900",
    "Container Numbers"
  );


  addSectionToReport(
    out,
    data.containers,
    "Add-on",
    "5658",
    "add-on NO defects - 5658",
    "add-on WITH defects - 5658",
    "Container Numbers"
  );


  out.push(
    "CHASSIS RACKS"
  );


  addSectionToReport(
    out,
    data.racks,
    "Pre-repair",
    "5657",
    "pre-repair NO defects - 5657",
    "pre-repair WITH defects - 5657",
    "Chassis Rack Numbers"
  );


  out.push(
    "(" +
    totalInspections() +
    ") TOTAL INSPECTIONS"
  );


  out.push("");


  out.push(
    "Comments or Notes of Interest:"
  );


  out.push(
    document
      .getElementById("notes")
      .value
      .trim()
  );


  return out.join("\n");

}


/* =========================
   GENERATE
   ========================= */

function generateEOD(){

  document
    .getElementById("preview")
    .textContent =
      buildEOD();


  document
    .getElementById("previewCard")
    .classList
    .remove("hidden");


  document
    .getElementById("previewCard")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


/* =========================
   DATE
   ========================= */

function formatDate(
  date = new Date()
){

  return (

/* =========================
   RESET
   ========================= */

function resetForNextDay(){

  Object.values(data)
    .forEach(equipment => {

      Object.values(equipment)
        .forEach(type => {

          Object.keys(type)
            .forEach(section => {

              type[section].length = 0;

            });

        });

    });


  document
    .getElementById("notes")
    .value = "";


  document
    .getElementById("number")
    .value = "";


  document
    .getElementById("equipmentNote")
    .value = "";


  document
    .getElementById("containerPrefix")
    .value = "";


  document
    .getElementById("containerNumber")
    .value = "";


  document
    .getElementById("containerNote")
    .value = "";


  document
    .getElementById("rackNumber")
    .value = "";


  document
    .getElementById("rackNote")
    .value = "";


  document
    .getElementById("preview")
    .textContent = "";


  document
    .getElementById("previewCard")
    .classList
    .add("hidden");


  document
    .getElementById("reportDate")
    .textContent =
      "Harrisburg — " +
      formatDate();


  updateProgress();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   EMAIL
   ========================= */

function emailEOD(){

  const body =
    buildEOD();


  const reportDate =
    document
      .getElementById("reportDate")
      .textContent
      .split("—")[1]
      .trim();


  const subject =
    "End of Day Report - Harrisburg - " +
    reportDate;


  resetForNextDay();


  window.location.href =
    "mailto:joe@caliberis.com" +
    "?cc=dgeist@caliberis.com,jdoan@aspectassociates.com" +
    "&subject=" +
    encodeURIComponent(subject) +
    "&body=" +
    encodeURIComponent(body);

}

      event.target.value =
        event.target.value
          .replace(/\D/g,"")
          .slice(0,6);

    }
  );


document
  .getElementById("containerPrefix")
  .addEventListener(
    "input",
    event => {
